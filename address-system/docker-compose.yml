services:
  mongo:
    image: mongo:7
    container_name: address-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: address-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/address_system
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=http://localhost:5000
    container_name: address-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:

